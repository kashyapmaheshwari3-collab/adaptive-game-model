name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src app tests scripts
          ruff format --check src app tests scripts

      - name: Run tests (fast suite, synthetic data)
        run: pytest -m "not slow" --maxfail=1

      - name: Pipeline smoke test (synthetic data)
        run: |
          python -c "import src.pipeline.run_all as r; r.run_pipeline(use_synthetic=True, quick=True)"

      - name: Verify reports generate
        run: |
          python scripts/generate_reports.py --quick
          test -f reports/technical_report.pdf
          test -f reports/coach_report.pdf

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t adaptive-game-model:ci .
