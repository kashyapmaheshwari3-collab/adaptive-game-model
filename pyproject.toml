[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-game-model"
version = "1.0.0"
description = "Adaptive Game Model: a context-aware tactical adjustment engine for football (event-based tactical decision intelligence)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["football", "soccer", "analytics", "tactics", "machine-learning", "causal-inference", "streamlit"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
    "mplsoccer>=1.3",
    "networkx>=3.1",
    "streamlit>=1.30",
    "shap>=0.44",
    "reportlab>=4.0",
    "Pillow>=10.0",
    "requests>=2.31",
    "pyarrow>=14.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "pre-commit>=3.6"]
bayes = ["pymc>=5.10"]          # optional Bayesian modelling (Phase 4 advanced extension)
optimisation = ["pulp>=2.8"]    # optional scheduling/line-up optimisation workbench
notebooks = ["jupyter>=1.0", "ipykernel>=6.25"]

[project.scripts]
agm-pipeline = "src.pipeline.run_all:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests that train full models on real data (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM113", "SIM115"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
